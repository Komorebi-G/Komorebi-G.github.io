<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识点编辑器 — LBH</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2353695a'/%3E%3Cpath d='M17 18h9v21h20v8H17z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/editor/editor.css">
    <link rel="stylesheet" href="./editor.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header>
          <div>
            <span class="mark">LBH</span>
            <p>Knowledge Editor</p>
          </div>
        </header>

        <nav class="editor-switch" aria-label="编辑器类型">
          <a href="/editor/">题目录入</a>
          <a href="/topic-editor/" aria-current="page">知识点</a>
        </nav>

        <label class="list-search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
          <input id="list-search" type="search" placeholder="搜索标签或已有专题">
        </label>
        <div class="list-filter">
          <button type="button" data-list-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-list-filter="written" aria-pressed="false">已整理</button>
          <button type="button" data-list-filter="pending" aria-pressed="false">待整理</button>
        </div>
        <div id="topic-list" class="problem-list"></div>
        <footer><span id="topic-count">0 个标签</span><span>LOCAL ONLY</span></footer>
      </aside>

      <main>
        <header class="topbar">
          <button id="mobile-list" class="mobile-list" type="button">标签列表</button>
          <div class="save-state">
            <span id="state-dot"></span>
            <span id="save-state">尚未修改</span>
          </div>
          <div class="top-actions">
            <a id="view-topic" href="/topics" target="_blank" hidden>查看网页</a>
            <button id="clear-draft" type="button">放弃修改</button>
            <button id="save-topic" class="primary" type="button">
              保存知识点
              <kbd>Ctrl S</kbd>
            </button>
          </div>
        </header>

        <form id="problem-form" novalidate>
          <section class="editor-pane">
            <div class="editor-heading">
              <p>TAG KNOWLEDGE</p>
              <h1 id="editor-title">选择一个标签</h1>
            </div>

            <div class="field full">
              <div class="label-line">
                <label for="content">知识点</label>
                <span>Markdown · LaTeX Math</span>
              </div>
              <textarea id="content" name="content" class="topic-content" spellcheck="false" placeholder="## 核心概念&#10;&#10;写下可以复用的知识……" required></textarea>
              <small>使用二级标题写知识点，三级标题写知识点内的小节；保存时会同步生成 PDF。</small>
            </div>
          </section>

          <aside class="preview-pane">
            <div class="preview-label">LIVE MARKDOWN PREVIEW</div>
            <article id="preview" class="topic-preview">
              <h2 id="preview-title">专题名称</h2>
              <div class="preview-section">
                <span>NOTE</span><strong>知识点</strong>
              </div>
              <div id="preview-content" class="preview-copy"><p>Markdown 正文会显示在这里。</p></div>
            </article>
          </aside>
        </form>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./editor.js"></script>
  </body>
</html>
