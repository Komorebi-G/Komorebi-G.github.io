<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识点编辑器 — LBH</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2353695a'/%3E%3Cpath d='M17 18h9v21h20v8H17z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/editor/editor.css">
    <link rel="stylesheet" href="./editor.css">
    <link rel="stylesheet" href="./shared/katex/katex.min.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header>
          <div>
            <a class="mark" href="/">LBH.</a>
            <p>知识点编辑</p>
          </div>
          <button id="new-topic" class="icon-button" type="button" title="新建标签知识点（Ctrl+N）">＋ 新建</button>
        </header>

        <nav class="editor-switch" aria-label="网站导航">
          <a href="/">概览</a>
          <a href="/problems">题目</a>
          <a href="/knowledge" aria-current="page">知识点</a>
          <a href="/algorithms">项目</a>
        </nav>
        <a class="editor-other" href="/editor/">记一题 ↗</a>

        <label class="list-search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
          <input id="list-search" type="search" placeholder="搜索知识点">
        </label>
        <div id="topic-list" class="problem-list"></div>
        <footer><span id="topic-count">0 个标签</span><a href="/knowledge">知识目录 ↗</a></footer>
      </aside>
      <button class="sidebar-backdrop" type="button" aria-label="收起标签列表"></button>

      <main>
        <header class="topbar">
          <button id="mobile-list" class="mobile-list" type="button">标签列表</button>
          <a class="back-to-archive" href="/knowledge">← 知识点目录</a>
          <div class="save-state">
            <span id="state-dot"></span>
            <span id="save-state">尚未修改</span>
          </div>
          <div class="top-actions">
            <button id="toggle-preview" type="button" aria-expanded="false" aria-controls="preview">预览</button>
            <a id="view-topic" href="/problems" target="_blank" hidden>查看网页</a>
            <button id="delete-topic" class="danger" type="button" hidden>删除</button>
            <button id="clear-draft" type="button">放弃修改</button>
            <button id="save-topic" class="primary" type="button">
              保存知识点
              <kbd>Ctrl S</kbd>
            </button>
          </div>
        </header>

        <form id="problem-form" novalidate>
          <section class="editor-pane">
            <div class="editor-heading">
              <p>算法概念 · 代码模板 · 易错点</p>
              <h1 id="editor-title">选择一个标签</h1>
            </div>

            <div id="new-topic-name" class="field full" hidden>
              <label for="topic-name">新标签名称</label>
              <input id="topic-name" type="text" list="known-tags" placeholder="例如：莫队" autocomplete="off">
              <datalist id="known-tags"></datalist>
              <small>可选择题目已经使用的标签，也可以创建新标签；保存后会出现在题目录入的标签建议中。</small>
            </div>

            <div class="field full">
              <div class="label-line">
                <label for="content">知识点</label>
                <span>Markdown · LaTeX Math</span>
              </div>
              <textarea id="content" name="content" class="topic-content" spellcheck="false" placeholder="## 核心概念&#10;&#10;写下可以复用的知识……" required></textarea>
              <small>二级标题表示知识点，三级标题表示小节；保存后会出现在知识点目录中。</small>
            </div>
          </section>

          <aside class="preview-pane">
            <div class="preview-label">文章预览</div>
            <article id="preview" class="topic-preview">
              <h2 id="preview-title">专题名称</h2>
              <div class="preview-section">
                <span>NOTE</span><strong>知识点</strong>
              </div>
              <div id="preview-content" class="preview-copy"><p>Markdown 正文会显示在这里。</p></div>
            </article>
          </aside>
        </form>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./editor.js"></script>
  </body>
</html>
